<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E5C9" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B88" />
      <stop offset="50%" stop-color="#EAAFA0" />
      <stop offset="100%" stop-color="#F9E2D8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular Emblem -->
  <g transform="translate(15, 10)">
    <circle cx="50" cy="50" r="46" fill="#14151D" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="50" cy="50" r="41" fill="none" stroke="url(#roseGrad)" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
    
    <!-- Stylized Tress Silhouette & Monogram T -->
    <path d="M 36 28 C 42 22, 58 22, 64 28 C 70 34, 62 42, 54 44 C 44 46, 42 56, 50 64 C 58 72, 68 62, 66 52" 
          fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M 38 72 C 44 64, 48 56, 50 44 L 50 76" 
          fill="none" stroke="url(#roseGrad)" stroke-width="2.8" stroke-linecap="round" />
    
    <!-- Delicate Shears Accent -->
    <circle cx="38" cy="74" r="3" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" />
    <circle cx="62" cy="74" r="3" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" />
    <line x1="40" y1="72" x2="52" y2="52" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />
    <line x1="60" y1="72" x2="48" y2="52" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />

    <!-- Sparkle Stars -->
    <polygon points="50,22 51.5,25.5 55,27 51.5,28.5 50,32 48.5,28.5 45,27 48.5,25.5" fill="url(#goldGrad)" />
  </g>

  <!-- Typography -->
  <g transform="translate(130, 0)">
    <text x="0" y="58" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" font-size="34" font-weight="700" letter-spacing="4" fill="url(#goldGrad)">TRESSTALK</text>
    <text x="3" y="85" font-family="'Montserrat', 'Outfit', 'Inter', sans-serif" font-size="11.5" font-weight="500" letter-spacing="6" fill="#D1D5DB">FAMILY SALON</text>
    <circle cx="160" cy="81.5" r="2" fill="url(#roseGrad)" />
    <text x="172" y="85" font-family="'Montserrat', 'Outfit', 'Inter', sans-serif" font-size="11" font-weight="400" letter-spacing="4" fill="#9CA3AF">BHOWANIPORE</text>
  </g>
</svg>